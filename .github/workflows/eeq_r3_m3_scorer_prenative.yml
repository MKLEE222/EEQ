name: EEQ R3 M3 pre-native scorer fail-closed kill tests
on:
  push:
    branches: [eeq-r3-m3-live-membership-c1-20261010]
    paths: [.github/workflows/eeq_r3_m3_scorer_prenative.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  no-kube-scorer:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Independently reopen hash-frozen source-only artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p in out
          curl --fail --location --retry 3 --retry-all-errors \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/MKLEE222/EEQ/actions/artifacts/11660256715/zip \
            -o in/immutable_stage1.zip
          echo 'd251df798e96eec0d1b4a39dd9b410678657fd025398f26c79cd277ccfd49f0e  in/immutable_stage1.zip' | sha256sum -c -
          unzip -q in/immutable_stage1.zip -d in/immutable
          echo 'd502d56bea25491e83af70c23835488d649cdd481dc15b171211e3385f252b44  in/immutable/model/SOURCE_MANIFEST.json' | sha256sum -c -
          echo '232f652d841b2871c089e0703c6f79785e051094e006ba01d37444d9a7ccc1a2  in/immutable/model/SOURCE_PREDICTIONS.json' | sha256sum -c -
      - name: Run all source and synthetic native-score anti-masking tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=experiments/native_distinction_relaunch/r3_m3 \
            python -m unittest -v test_r3_m3_source_only test_r3_m3_join_only_scorer \
            2>&1 | tee out/PRENATIVE_GUARD_TESTS.txt
          python -m py_compile \
            experiments/native_distinction_relaunch/r3_m3/r3_m3_native_k8s.py \
            experiments/native_distinction_relaunch/r3_m3/r3_m3_join_only_scorer.py
          sha256sum in/immutable/model/SOURCE_MANIFEST.json \
            in/immutable/model/SOURCE_PREDICTIONS.json \
            experiments/native_distinction_relaunch/r3_m3/r3_m3_native_k8s.py \
            experiments/native_distinction_relaunch/r3_m3/r3_m3_join_only_scorer.py \
            experiments/native_distinction_relaunch/r3_m3/test_r3_m3_join_only_scorer.py \
            > out/PRENATIVE_HASHED_CODE_AND_DATA.txt
          git rev-parse HEAD > out/CODE_SHA_COMMIT.txt
          echo 'NATIVE_NOT_EXECUTED_PRENATIVE_GUARD' > out/NATIVE_NOT_RUN.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eeq-r3-m3-prenative-scorer-kill-tests
          path: out
          if-no-files-found: error
