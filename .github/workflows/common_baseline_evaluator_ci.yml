name: common-baseline-evaluator-ci

on:
  push:
    branches:
      - kbs-parityplus-baselines-ci-chat
      - kbs-parityplus-baselines-g4fix-chat
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Static compile and unit regression
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile             experiments/common_evaluation/evaluate_representations.py             experiments/common_evaluation/test_evaluator.py
          (
            cd experiments/common_evaluation
            python3 test_evaluator.py
          )

      - name: CLI smoke test including NOT_APPLICABLE and ties
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evaluator-ci
          cat > evaluator-ci/input.json <<'JSON'
          {
            "rows": [
              {"native_action":"ACCEPT","representations":{"B1":{"x":0},"B10":{"z":0},"B9":"__NOT_APPLICABLE__"}},
              {"native_action":"REJECT","representations":{"B1":{"x":0},"B10":{"z":1},"B9":"__NOT_APPLICABLE__"}},
              {"native_action":"BLOCK","representations":{"B1":{"x":0},"B10":{"z":2},"B9":{"q":1}}},
              {"native_action":"ACCEPT","representations":{"B1":{"x":1},"B10":{"z":3},"B9":{"q":1}}}
            ]
          }
          JSON
          python3 experiments/common_evaluation/evaluate_representations.py             evaluator-ci/input.json             --out evaluator-ci/output.json             --accept-label ACCEPT             --tie-order REJECT,BLOCK,ACCEPT
          python3 - <<'PY'
          import json
          d=json.load(open("evaluator-ci/output.json"))
          r={x["baseline"]:x for x in d["baselines"]}
          assert r["B1"]["applicable_n"] == 4, r["B1"]
          assert r["B1"]["classes"] == 2, r["B1"]
          assert r["B1"]["mixed_classes"] == 1, r["B1"]
          assert r["B1"]["runs_in_mixed_classes"] == 3, r["B1"]
          assert r["B1"]["conflict_pairs"] == 3, r["B1"]
          assert r["B10"]["mixed_classes"] == 0, r["B10"]
          assert r["B10"]["oracle_optimal_accuracy"] == 1.0, r["B10"]
          assert r["B9"]["applicable_n"] == 2, r["B9"]
          print(json.dumps(r, indent=2, sort_keys=True))
          PY
          sha256sum             experiments/common_evaluation/evaluate_representations.py             experiments/common_evaluation/test_evaluator.py             evaluator-ci/input.json             evaluator-ci/output.json             > evaluator-ci/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: common-baseline-evaluator-ci
          path: evaluator-ci
          if-no-files-found: error
