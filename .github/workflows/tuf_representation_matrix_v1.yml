name: tuf-representation-matrix-v1

on:
  push:
    branches:
      - kbs-parityplus-tuf-representation-chat
    paths:
      - .github/workflows/tuf_representation_matrix_v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: experiments/bottlerocket/native_tuf/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Assert TUF representation freeze precedes scoring
        shell: bash
        run: |
          set -euo pipefail
          FREEZE=384adb6423fd701cb77c9fd4e61cdebc2cf6f9be
          git merge-base --is-ancestor "${FREEZE}" HEAD
          git diff --exit-code "${FREEZE}" HEAD --             experiments/common_evaluation/build_tuf_representations.js             experiments/common_evaluation/TUF_REPRESENTATION_V1_FREEZE.md
          git rev-parse HEAD
          git rev-parse "${FREEZE}"

      - name: Fetch and verify frozen Bottlerocket roots 1 through 8
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tuf-roots out
          BASE='https://updates.bottlerocket.aws/2020-07-07/aws-k8s-1.35/x86_64'
          for v in 1 2 3 4 5 6 7 8; do
            curl --fail --retry 3 --retry-all-errors -sSLo "tuf-roots/${v}.root.json" "${BASE}/${v}.root.json"
          done
          python - <<'PY'
          import hashlib, pathlib, re
          text=pathlib.Path('experiments/bottlerocket/FROZEN_SOURCE_INVENTORY.md').read_text()
          expected={}
          for line in text.splitlines():
              m=re.match(r'\|\s*([1-8])\s*\|\s*([0-9a-f]{64})\s*\|\s*(\d+)\s*\|', line)
              if m:
                  expected[int(m.group(1))]=(m.group(2),int(m.group(3)))
          assert sorted(expected)==list(range(1,9)), sorted(expected)
          rows=[]
          for v in range(1,9):
              p=pathlib.Path(f'tuf-roots/{v}.root.json')
              b=p.read_bytes()
              got=(hashlib.sha256(b).hexdigest(),len(b))
              assert got==expected[v], (v,got,expected[v])
              rows.append(f"{got[0]}  {p}")
          pathlib.Path('out/ROOT_SHA256SUMS.txt').write_text('\n'.join(rows)+'\n')
          PY

      - name: Build frozen TUF representations and score matrix
        shell: bash
        run: |
          set -euo pipefail
          (
            cd experiments/bottlerocket/native_tuf
            npm ci --ignore-scripts --no-audit --no-fund
          )
          export NODE_PATH="$PWD/experiments/bottlerocket/native_tuf/node_modules"
          node -r ./experiments/common_evaluation/tuf_models_v301_compat.js experiments/common_evaluation/build_tuf_representations.js             experiments/common_evaluation/results/UNIFIED_CASE_LEDGER.json             tuf-roots             out/TUF_REPRESENTATIONS_V1.json
          python experiments/common_evaluation/evaluate_representations.py             out/TUF_REPRESENTATIONS_V1.json             --out out/TUF_G4_MATRIX_V1.json
          python - <<'PY'
          import json
          reps=json.load(open('out/TUF_REPRESENTATIONS_V1.json'))
          matrix=json.load(open('out/TUF_G4_MATRIX_V1.json'))
          assert len(reps['rows'])==7
          assert all(r['domain']=='TUF:bottlerocket-root' for r in reps['rows'])
          assert all(len(r['representations'])==19 for r in reps['rows'])
          domain=matrix['domains']['TUF:bottlerocket-root']
          ids={x['baseline'] for x in domain['baselines']}
          assert ids=={f'B{i}' for i in range(11)}|{f'O{i}' for i in range(1,9)}, ids
          assert all(r['native_action']=='ACCEPT' for r in reps['rows'])
          print(json.dumps({
              'rows':len(reps['rows']),
              'matrix_ids':len(ids),
              'all_native_labels_same_warning':reps['all_native_labels_same_warning'],
          }, sort_keys=True))
          PY
          sha256sum             experiments/common_evaluation/build_tuf_representations.js             experiments/common_evaluation/TUF_REPRESENTATION_V1_FREEZE.md             experiments/common_evaluation/tuf_models_v301_compat.js             out/TUF_REPRESENTATIONS_V1.json             out/TUF_G4_MATRIX_V1.json             > out/SHA256SUMS.txt
          git rev-parse HEAD > out/WORKFLOW_COMMIT.txt
          printf '%s\n' '384adb6423fd701cb77c9fd4e61cdebc2cf6f9be' > out/REPRESENTATION_FREEZE_COMMIT.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tuf-representation-matrix-v1
          path: out
          if-no-files-found: warn
