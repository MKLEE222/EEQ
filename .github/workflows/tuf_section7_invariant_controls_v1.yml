name: tuf-section7-invariant-controls-v1

on:
  push:
    branches:
      - kbs-parityplus-protocol-expansion-chat
    paths:
      - .github/workflows/tuf_section7_invariant_controls_v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: experiments/bottlerocket/native_tuf/package-lock.json

      - name: Assert invariant-control freeze predates native scoring
        shell: bash
        run: |
          set -euo pipefail
          FREEZE_DOC=6c4c664ef102f9b47fafe16941921f649d9b3c44
          FREEZE_IMPL=bf4066ede0390df549f436c5cea5154f01ac49ce
          git merge-base --is-ancestor "$FREEZE_DOC" HEAD
          git merge-base --is-ancestor "$FREEZE_IMPL" HEAD
          git diff --exit-code "$FREEZE_IMPL" HEAD --             experiments/bottlerocket/TUF_INVARIANT_CONTROLS_V1_FREEZE.md             experiments/bottlerocket/native_tuf/run_tuf_invariant_controls.js
          sha256sum             experiments/bottlerocket/TUF_INVARIANT_CONTROLS_V1_FREEZE.md             experiments/bottlerocket/native_tuf/run_tuf_invariant_controls.js             > frozen-inputs.sha256

      - name: Fetch and verify production roots 1..3
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p roots out
          BASE='https://updates.bottlerocket.aws/2020-07-07/aws-k8s-1.35/x86_64'
          for v in 1 2 3; do
            curl --fail --retry 3 --retry-all-errors -sSLo "roots/${v}.root.json" "${BASE}/${v}.root.json"
          done
          python - <<'PY'
          import hashlib, pathlib, re
          text=pathlib.Path('experiments/bottlerocket/FROZEN_SOURCE_INVENTORY.md').read_text()
          expected={}
          for line in text.splitlines():
              m=re.match(r'\|\s*([1-3])\s*\|\s*([0-9a-f]{64})\s*\|\s*(\d+)\s*\|',line)
              if m:
                  expected[int(m.group(1))]=(m.group(2),int(m.group(3)))
          assert sorted(expected)==[1,2,3], expected
          rows=[]
          for v in (1,2,3):
              p=pathlib.Path(f'roots/{v}.root.json')
              b=p.read_bytes()
              got=(hashlib.sha256(b).hexdigest(),len(b))
              assert got==expected[v], (v,got,expected[v])
              rows.append(f'{got[0]}  {p}')
          pathlib.Path('out/ROOT_SHA256SUMS.txt').write_text('\n'.join(rows)+'\n')
          PY

      - name: Install pinned tuf-js
        working-directory: experiments/bottlerocket/native_tuf
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run frozen Section-7 invariant controls
        shell: bash
        run: |
          set -euo pipefail
          export NODE_PATH="$PWD/experiments/bottlerocket/native_tuf/node_modules"
          node experiments/bottlerocket/native_tuf/run_tuf_invariant_controls.js             roots out/TUF_INVARIANT_CONTROLS_V1_RESULT.json
          python - <<'PY'
          import json
          p=json.load(open('out/TUF_INVARIANT_CONTROLS_V1_RESULT.json'))
          assert p['summary']['controls']==2, p
          assert p['summary']['matched']==2, p
          assert p['summary']['mismatches']==0, p
          assert p['summary']['accepted']==2, p
          assert p['summary']['rejected']==0, p
          assert all(x['bytes_changed'] for x in p['controls'])
          assert all(x['expected_native_action']=='ACCEPT' for x in p['controls'])
          assert all(x['native_action']=='ACCEPT' for x in p['controls'])
          assert p['g5_count_effect']==0
          assert p['fifth_family_holdout']=='UNOPENED'
          print(json.dumps(p['summary'],sort_keys=True))
          PY
          sha256sum             frozen-inputs.sha256             out/ROOT_SHA256SUMS.txt             out/TUF_INVARIANT_CONTROLS_V1_RESULT.json             > out/SHA256SUMS.txt
          git rev-parse HEAD > out/WORKFLOW_COMMIT.txt
          printf '%s\n' 'bf4066ede0390df549f436c5cea5154f01ac49ce' > out/IMPLEMENTATION_FREEZE_COMMIT.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tuf-section7-invariant-controls-v1
          path: out
          if-no-files-found: warn
