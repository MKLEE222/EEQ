name: eeq-r1e-tuf-quotient-pressure

on:
  push:
    branches:
      - eeq-native-distinction-relaunch-20261008
    paths:
      - .github/workflows/eeq_r1e_tuf_quotient_pressure.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Assert registered full-action scope and source-only audit
        shell: bash
        run: |
          set -euo pipefail
          test -f experiments/native_distinction_relaunch/13_R1E_SOURCE_QUOTIENT_PRESSURE_FREEZE.md
          test "$(git rev-parse HEAD:parityplus/g4/UNIFIED_PROTOCOL_FREEZE_v1.md)" = 3eeaeeb828d2fcf7ec4487da06489fee3146c920
          mkdir -p pre out

      - name: Restore unchanged original 56-cell source predictions (no native data)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --retry 3 --retry-all-errors --location \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/MKLEE222/EEQ/actions/artifacts/11558989924/zip' \
            -o pre/source.zip
          echo 'c37f947099c7e7bcbcce0778618123d577395dce4addd0ca291e57d84d6e30b3  pre/source.zip' | sha256sum -c -
          unzip -q pre/source.zip -d pre/unpacked
          echo '81b1fd5ff0b7080d33b952d4ae9e890db8e5e4260831899bf773937152f91fed  pre/unpacked/TUF_R1B_V3_SOURCE_CRYPTO_PREDICTIONS.json' | sha256sum -c -

      - name: Enumerate exact full registered decision/future partitions
        shell: bash
        run: |
          set -euo pipefail
          python experiments/native_distinction_relaunch/r1e_tuf_quotient_pressure.py \
            --pred pre/unpacked/TUF_R1B_V3_SOURCE_CRYPTO_PREDICTIONS.json \
            --out out/R1E_TUF_REGISTERED_QUOTIENT_AUDIT.json \
            | tee out/R1E_STDOUT.txt
          python - <<'PY'
          import json
          x=json.load(open('out/R1E_TUF_REGISTERED_QUOTIENT_AUDIT.json'))
          assert x['state_count']==8 and x['actions']==7
          assert x['unordered_state_pairs']==28
          assert x['full_action_domain_preserved']
          assert x['source_only_no_native_labels']
          print('Frozen read-only quotient pressure completed (not R2)')
          PY
          sha256sum pre/source.zip out/R1E_TUF_REGISTERED_QUOTIENT_AUDIT.json \
            experiments/native_distinction_relaunch/r1e_tuf_quotient_pressure.py \
            > out/R1E_SHA256SUMS.txt
          git rev-parse HEAD > out/WORKFLOW_COMMIT.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eeq-r1e-tuf-quotient-pressure
          path: out
          if-no-files-found: error
