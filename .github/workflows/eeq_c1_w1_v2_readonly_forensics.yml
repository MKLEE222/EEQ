name: EEQ C1 W1 V2 read-only post-native JSON shape forensics
on:
  push:
    branches: [eeq-c1-w1-v2-postnative-shape-audit-20261010]
    paths: [.github/workflows/eeq_c1_w1_v2_readonly_forensics.yml]
  workflow_dispatch:

permissions: {contents: read, actions: read}

jobs:
  readonly_no_native_no_repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Confirm V1 failed workflow and immutable G4
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:parityplus/g4/UNIFIED_PROTOCOL_FREEZE_v1.md)" = 3eeaeeb828d2fcf7ec4487da06489fee3146c920
          test -f experiments/native_distinction_relaunch/c1_w1/v2/00_V1_FAILURE_AND_V2_READONLY_SHAPE_FORENSICS_FREEZE.md
          mkdir -p out old
          echo 'ORIGINAL_W1_NATIVE_ACTIONS_38029036440_SCIENTIFIC_GATE_FAILURE'
      - name: Inspect only fake pre-native shapes to ensure audit never changes original
        working-directory: experiments/native_distinction_relaunch/c1_w1/v2
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v test_c1_w1_v2_readonly_native_shape.py
          python -m py_compile c1_w1_v2_readonly_native_shape.py
      - name: Download untouched failed original W1 native artifact, verify authentic hashes
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-all-errors \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/MKLEE222/EEQ/actions/artifacts/11661372658/zip' \
            -o old/ORIGINAL_FAILED_V1_W1_NATIVE_ARTIFACT.zip
          echo '9d2dc931d239f4a269da00038d322c5f795001afec8da22d3b311360740af94d  old/ORIGINAL_FAILED_V1_W1_NATIVE_ARTIFACT.zip' | sha256sum -c -
          unzip -q old/ORIGINAL_FAILED_V1_W1_NATIVE_ARTIFACT.zip -d old/expanded
          cd old/expanded
          test -s C1_W1_RAW_NATIVE_HTTP_WATCH.json
          test -s C1_W1_NATIVE_HASH_BEFORE_SOURCE_JOIN.txt
          sha256sum -c C1_W1_NATIVE_HASH_BEFORE_SOURCE_JOIN.txt || (
            cd ../.. && sed -e 's@out/@@g' old/expanded/C1_W1_NATIVE_HASH_BEFORE_SOURCE_JOIN.txt | (cd old/expanded && sha256sum -c -)
          )
      - name: Read-only inspect native LIST objects versus WATCH objects and retain exact schema
        shell: bash
        run: |
          set -euo pipefail
          python experiments/native_distinction_relaunch/c1_w1/v2/c1_w1_v2_readonly_native_shape.py \
            --native old/expanded/C1_W1_RAW_NATIVE_HTTP_WATCH.json \
            --native-hash old/expanded/C1_W1_NATIVE_HASH_BEFORE_SOURCE_JOIN.txt \
            --out out/C1_W1_V2_READONLY_NATIVE_SHAPE_FORENSICS.json \
            | tee out/V2_SHAPE_DIAGNOSTIC_SUMMARY.txt
          sha256sum out/C1_W1_V2_READONLY_NATIVE_SHAPE_FORENSICS.json > out/V2_SHAPE_DIAGNOSTIC_SHA256.txt
          echo 'POST_NATIVE_FORENSIC_ONLY_V1_GATE_STILL_FAILURE' > out/SCIENCE_DISPOSITION.txt
      - name: Preserve shape-forensics artifact (never a new native score)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eeq-c1-w1-v2-readonly-native-shape-diagnostic
          path: out
          if-no-files-found: warn
